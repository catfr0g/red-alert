repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.78
    hooks:
      - id: ty
        args: [--isolated]
  - repo: local
    hooks:
      - id: export-requirements
        name: export uv.lock to requirements.txt
        entry: uv export --frozen --no-dev --no-hashes -o requirements.txt
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
