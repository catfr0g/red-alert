schema: spec-driven

context: |
  Проект: Red Alert
  Назначение: прототип инструмента для авторизованного защитного тестирования (red teaming) агентных ИИ-систем.
  Предметная область: тестирование безопасности ИИ-агентов, которые используют инструменты, сохраняют память и изменяют состояние.

  Технологический стек и текущее состояние:
  - Python 3.14+.
  - Метаданные проекта и зависимости управляются через pyproject.toml.
  - В репозитории пока нет зависимостей времени выполнения и настроенного тестового фреймворка.
  - Текущая точка запуска — main.py.

  Структура репозитория:
  - openspec/: конфигурация OpenSpec, основные спецификации и активные/архивные changes.
  - docs/product.md: описание продукта и границ PoC.
  - docs/business/: бизнес-контекст, глоссарий, описание кейса и вопросы к заинтересованным сторонам.
  - .codex/, .cursor/, .opencode/: сгенерированные или специфичные для инструментов файлы интеграции с OpenSpec; не считать их кодом продукта.

  Доменный контекст:
  - Основной пользователь — департамент кибербезопасности банка, проверяющий генеративные ИИ-системы.
  - Главная ценность — воспроизводимые доказательства того, как недоверенный ввод влияет на контекст, память, использование инструментов, состояние агента и последующие действия.
  - Attack Success Rate (ASR) — одна из ключевых метрик, но успешность атаки нужно оценивать по её влиянию на поведение или состояние агента, а не только по внешне вредоносному текстовому ответу.

  Рабочие соглашения:
  - Основные артефакты OpenSpec (proposal, design, specs, tasks), продуктовая и доменная документация оформляются на русском языке.
  - Идентификаторы кода, названия файлов, команд и устоявшиеся технические термины могут оставаться на английском языке.
  - Использовать упрощённый технический язык: короткие однозначные формулировки, минимум жаргона и без лишней теории.
  - Следовать принципам YAGNI и KISS: не добавлять невостребованные возможности и выбирать простое решение.
  - Следовать принципу DRY, но не создавать преждевременные абстракции ради устранения единичного повтора.
  - Предпочитать минимальную реализацию, удовлетворяющую утверждённой спецификации.
  - Сохранять трассируемость: требования должны быть связаны с реализацией, тестами и наблюдаемыми доказательствами.
  - Каждая новая функциональность (фича) должна включать автоматические тесты; фича не считается завершённой без них.
  - Предпочитать детерминированные фикстуры, mock-инструменты и изолированные тестовые контуры, чтобы сценарии были безопасными и воспроизводимыми.

  - Все диаграммы в артефактах OpenSpec (proposal, design, specs, tasks) оформляются в fenced-блоках Markdown с языком `mermaid`; ASCII-схемы и другие языки описания диаграмм не используются.

  Процесс OpenSpec:
  - Для изменений поведения или архитектуры использовать workflow spec-driven.
  - При реализации change считать его активные артефакты источником истины.
  - Не придумывать молча предположения по безопасности: фиксировать их в соответствующем артефакте или запрашивать уточнение.

rules:
  proposal:
    - Описать проблему, ожидаемый результат, границы и то, что явно не входит в объём работы.
    - Фиксировать неразрешённые предположения и вопросы, а не прятать их в деталях реализации.
    - Сосредоточить proposal на одном целостном change.
  design:
    - Описать минимальную жизнеспособную архитектуру и ключевые потоки данных и управления.
    - При необходимости объяснить границы доверия, изменения состояния, наблюдаемость и безопасную изоляцию тестов.
    - Указать существенные альтернативы и причины, по которым они не выбраны.
  specs:
    - Описывать внешне наблюдаемое поведение однозначными формулировками «СИСТЕМА ДОЛЖНА».
    - Добавлять конкретные сценарии для штатных, граничных, ошибочных и чувствительных к безопасности случаев.
    - Определять, какое доказательство или изменение состояния подтверждает успешность сценария.
  tasks:
    - Разбивать работу на небольшие независимо проверяемые задачи.
    - Для каждой фичи предусматривать автоматические тесты, а также валидацию и обновление документации, если они входят в change.
    - Сохранять связь каждой задачи с требованием или архитектурным решением.
